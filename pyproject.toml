[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sk4n"
version = "0.1.0"
description = "Command-line tools and agent skills for NUS services"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "beautifulsoup4>=4.14.3",
    "platformdirs>=4.5.1",
    "playwright>=1.60.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "urllib3>=2.6.0",
]

[project.scripts]
sk4n = "sk4n.cli:main"
canvas = "canvas.cli:main"
nusmods = "nusmods.cli:main"
talent-connect = "talent_connect.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sk4n", "canvas", "nusmods", "talent_connect", "tools"]

# Markdown and metadata stored below sk4n/skills are package data. The
# skill directories themselves are introduced in Phase 2.
[tool.hatch.build]
artifacts = ["/sk4n/skills/**"]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "C4", "SIM", "A", "RUF", "PLC0415"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = "error"
reportInvalidTypeForm = "error"
reportOverlappingOverload = "error"
reportUntypedFunctionDecorator = "warning"
reportPrivateUsage = "warning"
reportUnusedImport = "information"
