[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sk4n"
version = "0.1.0"
description = "Command-line tools and agent skills for NUS services"
readme = "README.md"
authors = [{ name = "hykzr" }]
maintainers = [{ name = "hykzr" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "beautifulsoup4>=4.14.3",
    "platformdirs>=4.5.1",
    "playwright>=1.60.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "urllib3>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/hykzr/sk4n"
Repository = "https://github.com/hykzr/sk4n"
Issues = "https://github.com/hykzr/sk4n/issues"
Changelog = "https://github.com/hykzr/sk4n/blob/main/CHANGELOG.md"

[project.scripts]
sk4n = "sk4n.cli:main"
canvas = "sk4n.canvas.cli:main"
nusmods = "sk4n.nusmods.cli:main"
talent-connect = "sk4n.talent_connect.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sk4n"]

# Markdown and metadata stored below src/sk4n/skills are package data.
[tool.hatch.build]
artifacts = ["/src/sk4n/skills/**"]

[dependency-groups]
dev = [
    "build>=1.3.0",
    "pip-audit>=2.10.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "twine>=7.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "C4", "SIM", "A", "RUF", "PLC0415"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = "error"
reportInvalidTypeForm = "error"
reportOverlappingOverload = "error"
reportUntypedFunctionDecorator = "warning"
reportPrivateUsage = "warning"
reportUnusedImport = "information"
