[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-for-nus"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bs4>=0.0.2",
    "langchain>=1.3.4",
    "langchain-anthropic>=1.4.4",
    "langchain-google-genai>=4.2.4",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.2.2",
    "nest-asyncio>=1.6.0",
    "openpyxl>=3.1.5",
    "playwright>=1.60.0",
    "pyrootutils>=1.0.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
nusmods = "nusmods.cli:main"
talent-connect = "talent_connect.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["canvas_sync", "nusmods", "talent_connect", "tools"]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "C4", "SIM", "A", "RUF", "PLC0415"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = "error"
reportInvalidTypeForm = "error"
reportOverlappingOverload = "error"
reportUntypedFunctionDecorator = "warning"
reportPrivateUsage = "warning"
reportUnusedImport = "information"
